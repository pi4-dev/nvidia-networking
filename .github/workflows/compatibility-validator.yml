name: Compatibility validator

on:
  push:
    branches: [main]
    paths:
      - 'compatibility-validator/**'
      - 'data/nvidia-interconnects.json'
      - '.github/workflows/compatibility-validator.yml'
      - '.dockerignore'
  pull_request:
    paths:
      - 'compatibility-validator/**'
      - 'data/nvidia-interconnects.json'
      - '.github/workflows/compatibility-validator.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: compatibility-validator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: compatibility-validator/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: compatibility-validator/package-lock.json
      - name: Install locked runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements.txt
          python -m pip check
      - name: Catalog, rules and real HTTP regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Browser state, stale responses and export tests
        run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image with locked dependencies
        run: docker compose -f compatibility-validator/docker-compose.yml build
      - name: Start with production resource limits and read-only mounts
        run: docker compose -f compatibility-validator/docker-compose.yml up -d --wait --wait-timeout 90
      - name: Check application data and both-end validation
        run: python3 compatibility-validator/tests/smoke.py http://127.0.0.1:8080
      - name: Container logs
        if: failure()
        run: docker compose -f compatibility-validator/docker-compose.yml logs
      - name: Stop test service
        if: always()
        run: docker compose -f compatibility-validator/docker-compose.yml down
